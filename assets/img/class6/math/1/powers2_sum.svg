<text x="138.0" y="91.3" font-size="13" fill="#263238" text-anchor="start">1 + 1 = 2, 2 + 2 = 4,</text>
<text x="138.0" y="112.1" font-size="13" fill="#263238" text-anchor="start">4 + 4 = 8, 8 + 8 = 16</text>
