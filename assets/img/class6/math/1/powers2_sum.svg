<text x="53.0" y="114.5" font-size="13" fill="#263238" text-anchor="middle" font-weight="bold">1</text>
<polygon points="14.0,92.0 66.0,92.0 66.0,66.0 14.0,66.0" fill="#a5d6a7" stroke="#263238" stroke-width="2" stroke-linejoin="round"/>
<text x="40.0" y="88.5" font-size="13" fill="#263238" text-anchor="middle" font-weight="bold">2</text>
<polygon points="14.0,66.0 66.0,66.0 66.0,14.0 14.0,14.0" fill="#ffcc80" stroke="#263238" stroke-width="2" stroke-linejoin="round"/>
