<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 226" width="544" height="226" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="81.2" y="60.9" font-size="14" fill="#263238" text-anchor="end" font-weight="bold">1</text>
<text x="93.2" y="60.9" font-size="14" fill="#263238" text-anchor="start">= 11 × 0 + 1</text>
<text x="311.2" y="60.5" font-size="13" fill="#2e7d32" text-anchor="start">one MORE than a multiple of 11</text>
<text x="81.2" y="90.9" font-size="14" fill="#263238" text-anchor="end" font-weight="bold">10</text>
<text x="93.2" y="90.9" font-size="14" fill="#263238" text-anchor="start">= 11 × 1 − 1</text>
<text x="311.2" y="90.5" font-size="13" fill="#c62828" text-anchor="start">one LESS than a multiple of 11</text>
<text x="81.2" y="120.9" font-size="14" fill="#263238" text-anchor="end" font-weight="bold">100</text>
<text x="93.2" y="120.9" font-size="14" fill="#263238" text-anchor="start">= 11 × 9 + 1</text>
<text x="311.2" y="120.5" font-size="13" fill="#2e7d32" text-anchor="start">one MORE than a multiple of 11</text>
<text x="81.2" y="150.9" font-size="14" fill="#263238" text-anchor="end" font-weight="bold">1,000</text>
<text x="93.2" y="150.9" font-size="14" fill="#263238" text-anchor="start">= 11 × 91 − 1</text>
<text x="311.2" y="150.6" font-size="13" fill="#c62828" text-anchor="start">one LESS than a multiple of 11</text>
<text x="81.2" y="180.9" font-size="14" fill="#263238" text-anchor="end" font-weight="bold">10,000</text>
<text x="93.2" y="180.9" font-size="14" fill="#263238" text-anchor="start">= 11 × 909 + 1</text>
<text x="311.2" y="180.6" font-size="13" fill="#2e7d32" text-anchor="start">one MORE than a multiple of 11</text>
<text x="81.2" y="210.9" font-size="14" fill="#263238" text-anchor="end" font-weight="bold">1,00,000</text>
<text x="93.2" y="210.9" font-size="14" fill="#263238" text-anchor="start">= 11 × 9,091 − 1</text>
<text x="311.2" y="210.6" font-size="13" fill="#c62828" text-anchor="start">one LESS than a multiple of 11</text>
<text x="21.2" y="30.2" font-size="12" fill="#8a969c" text-anchor="start">place value</text>
</svg>
