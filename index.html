<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maths — Notes</title>
<meta name="description" content="Quick CBSE / NCERT maths revision notes, organised by topic — editable Markdown, rendered in the browser.">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="wrap notes">
    <header class="hero">
      <span class="pill">📘 CBSE · NCERT</span>
      <h1 class="title"><span class="grad">Maths</span></h1>
    </header>

    <!-- Notes are loaded from content/math/*.md and rendered here by assets/js/app.js -->
    <div id="app">
      <div class="empty"><div class="big">⏳</div><strong>Loading notes…</strong></div>
    </div>
  </div>

  <script src="assets/js/marked.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
